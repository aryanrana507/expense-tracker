<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>
<style>
  :root {
    --bg: #0b0f17;
    --card: #141a26;
    --card-2: #1a2233;
    --border: rgba(255, 255, 255, 0.09);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --green: #4ade80;
    --green-soft: rgba(74, 222, 128, 0.14);
    --red: #f87171;
    --red-soft: rgba(248, 113, 113, 0.14);
    --accent: #22d3ee;
    --accent-soft: rgba(34, 211, 238, 0.14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 28px 16px 48px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 26px; }
  header h1 { font-size: clamp(26px, 5vw, 36px); font-weight: 800; letter-spacing: -0.02em; }
  header h1 span { color: var(--accent); }
  header p { color: var(--muted); font-size: 14px; margin-top: 6px; }

  /* Summary cards */
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 22px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }
  .card .label { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .card .value { font-size: clamp(22px, 4.5vw, 32px); font-weight: 800; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .card.balance .value { color: var(--accent); }
  .card.income .value { color: var(--green); }
  .card.expense .value { color: var(--red); }

  /* Add form */
  .form { margin-bottom: 22px; }
  .form h2, .section h2 { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
  .form-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr auto; gap: 10px; align-items: end; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select {
    width: 100%;
    font-family: inherit; font-size: 15px; color: var(--text);
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 12px;
    outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field select option { background: var(--card-2); }
  .btn {
    font-family: inherit; font-size: 15px; font-weight: 700;
    border: none; border-radius: 10px; cursor: pointer;
    padding: 12px 20px; transition: transform 0.15s, opacity 0.15s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-add { background: var(--accent); color: #04121a; }
  .btn-danger { background: transparent; color: var(--red); border: 1px solid rgba(248, 113, 113, 0.4); font-size: 13px; padding: 8px 14px; }
  .btn-danger:hover { background: var(--red-soft); }

  /* Filters */
  .filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .chip {
    font-family: inherit; font-size: 13px; font-weight: 600;
    color: var(--muted); background: var(--card);
    border: 1px solid var(--border); border-radius: 99px;
    padding: 8px 16px; cursor: pointer; transition: all 0.2s;
  }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #04121a; }
  .filters select {
    font-family: inherit; font-size: 13px; font-weight: 600; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: 99px;
    padding: 8px 12px; outline: none; cursor: pointer;
  }
  .filters select option { background: var(--card-2); }
  .spacer { flex: 1; }

  /* Transaction list */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .txn {
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px;
  }
  .txn .icon {
    width: 42px; height: 42px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; border-radius: 12px;
  }
  .txn.income .icon { background: var(--green-soft); }
  .txn.expense .icon { background: var(--red-soft); }
  .txn .info { flex: 1; min-width: 0; }
  .txn .desc { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .txn .meta { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .badge {
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
    padding: 2px 8px; border-radius: 99px;
    background: var(--accent-soft); color: var(--accent);
  }
  .txn .amount { font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .txn.income .amount { color: var(--green); }
  .txn.expense .amount { color: var(--red); }
  .del {
    font-family: inherit; font-size: 18px; line-height: 1;
    background: transparent; border: none; color: var(--muted);
    cursor: pointer; padding: 6px 8px; border-radius: 8px;
  }
  .del:hover { color: var(--red); background: var(--red-soft); }
  .empty {
    text-align: center; color: var(--muted); font-size: 14px;
    background: var(--card); border: 1px dashed var(--border);
    border-radius: 14px; padding: 28px 16px;
  }

  /* Category breakdown */
  .section { margin-top: 26px; }
  .bars { display: flex; flex-direction: column; gap: 12px; }
  .bar-row { display: grid; grid-template-columns: 130px 1fr 90px; gap: 12px; align-items: center; font-size: 14px; }
  .bar-row .cat-name { font-weight: 600; }
  .bar-track { height: 10px; background: rgba(255, 255, 255, 0.08); border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #a78bfa); border-radius: 99px; transition: width 0.4s; }
  .bar-row .cat-amount { text-align: right; font-weight: 700; color: var(--red); font-variant-numeric: tabular-nums; }
  .bars-empty { color: var(--muted); font-size: 14px; text-align: center; padding: 12px; }

  footer { text-align: center; color: var(--muted); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; margin-top: 36px; }
  footer span { color: var(--accent); }

  @media (max-width: 720px) {
    .summary { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr 1fr; }
    .bar-row { grid-template-columns: 100px 1fr 80px; }
  }
  @media (max-width: 420px) {
    .form-grid { grid-template-columns: 1fr; }
    .txn .meta { gap: 5px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>💰 Expense <span>Tracker</span></h1>
    <p>Track your money — income &amp; expenses, all saved in your browser.</p>
  </header>

  <!-- Summary -->
  <section class="summary">
    <div class="card balance"><div class="label">Total Balance</div><div class="value" id="totalBalance">₹0</div></div>
    <div class="card income"><div class="label">Total Income</div><div class="value" id="totalIncome">₹0</div></div>
    <div class="card expense"><div class="label">Total Expense</div><div class="value" id="totalExpense">₹0</div></div>
  </section>

  <!-- Add transaction -->
  <section class="card form">
    <h2>Add Transaction</h2>
    <form id="addForm" class="form-grid">
      <div class="field">
        <label for="desc">Description</label>
        <input id="desc" type="text" placeholder="e.g. Groceries at Big Bazaar" maxlength="60" required>
      </div>
      <div class="field">
        <label for="amount">Amount (₹)</label>
        <input id="amount" type="number" min="1" step="0.01" placeholder="500" required>
      </div>
      <div class="field">
        <label for="type">Type</label>
        <select id="type">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>
      </div>
      <div class="field">
        <label for="category">Category</label>
        <select id="category">
          <option>Food</option>
          <option>Transport</option>
          <option>Shopping</option>
          <option>Bills</option>
          <option>Entertainment</option>
          <option>Salary</option>
          <option>Other</option>
        </select>
      </div>
      <div class="field">
        <label for="date">Date</label>
        <input id="date" type="date" required>
      </div>
      <button class="btn btn-add" type="submit">+ Add</button>
    </form>
  </section>

  <!-- Filters -->
  <div class="filters">
    <button class="chip active" data-filter="all" type="button">All</button>
    <button class="chip" data-filter="income" type="button">Income</button>
    <button class="chip" data-filter="expense" type="button">Expense</button>
    <select id="catFilter" aria-label="Filter by category">
      <option value="All">All categories</option>
      <option>Food</option>
      <option>Transport</option>
      <option>Shopping</option>
      <option>Bills</option>
      <option>Entertainment</option>
      <option>Salary</option>
      <option>Other</option>
    </select>
    <div class="spacer"></div>
    <button class="btn btn-danger" id="clearAll" type="button">Clear All</button>
  </div>

  <!-- Transaction list -->
  <div class="list" id="txnList"></div>

  <!-- Category breakdown -->
  <section class="card section">
    <h2>Spending by Category</h2>
    <div class="bars" id="bars"></div>
  </section>

  <footer>Expense Tracker &nbsp;•&nbsp; <span>aryanrana507</span></footer>
</div>

<script>
var LS_KEY = 'expense-tracker-txns';
var CATEGORIES = ['Food', 'Transport', 'Shopping', 'Bills', 'Entertainment', 'Salary', 'Other'];
var CAT_ICONS = {
  Food: '🍔', Transport: '🚌', Shopping: '🛍️', Bills: '🧾',
  Entertainment: '🎬', Salary: '💼', Other: '📦'
};

function isoDate(offsetDays) {
  var d = new Date();
  d.setDate(d.getDate() + offsetDays);
  return d.toISOString().slice(0, 10);
}

function seedTxns() {
  return [
    { id: 1, desc: 'Monthly Salary', amount: 45000, type: 'income', category: 'Salary', date: isoDate(-9) },
    { id: 2, desc: 'Groceries at Big Bazaar', amount: 2450, type: 'expense', category: 'Food', date: isoDate(-8) },
    { id: 3, desc: 'Metro card recharge', amount: 500, type: 'expense', category: 'Transport', date: isoDate(-6) },
    { id: 4, desc: 'New headphones', amount: 1999, type: 'expense', category: 'Shopping', date: isoDate(-4) },
    { id: 5, desc: 'Electricity bill', amount: 1320, type: 'expense', category: 'Bills', date: isoDate(-3) },
    { id: 6, desc: 'Movie night with friends', amount: 850, type: 'expense', category: 'Entertainment', date: isoDate(-2) },
    { id: 7, desc: 'Freelance design work', amount: 6000, type: 'income', category: 'Other', date: isoDate(-1) },
    { id: 8, desc: 'Lunch at cafe', amount: 420, type: 'expense', category: 'Food', date: isoDate(0) }
  ];
}

function loadTxns() {
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return parsed;
    }
  } catch (e) { /* corrupted storage -> reseed */ }
  var seed = seedTxns();
  saveTxns(seed);
  return seed;
}

function saveTxns(txns) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(txns)); } catch (e) { /* storage full/blocked */ }
}

function computeTotals(txns) {
  var income = 0, expense = 0;
  txns.forEach(function (t) {
    if (t.type === 'income') income += t.amount;
    else expense += t.amount;
  });
  return { income: income, expense: expense, balance: income - expense };
}

function getExpenseByCategory(txns) {
  var map = {};
  txns.forEach(function (t) {
    if (t.type !== 'expense') return;
    map[t.category] = (map[t.category] || 0) + t.amount;
  });
  return Object.keys(map).map(function (cat) {
    return { category: cat, total: map[cat] };
  }).sort(function (a, b) { return b.total - a.total; });
}

function fmt(n) {
  return '₹' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 2 });
}

function fmtDate(iso) {
  var d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

var state = {
  txns: loadTxns(),
  filter: 'all',
  catFilter: 'All',
  nextId: 0
};
state.nextId = state.txns.reduce(function (m, t) { return Math.max(m, t.id || 0); }, 0) + 1;

function addTxn(data) {
  var txn = {
    id: state.nextId++,
    desc: data.desc.trim(),
    amount: Math.round(data.amount * 100) / 100,
    type: data.type,
    category: data.category,
    date: data.date
  };
  state.txns.push(txn);
  saveTxns(state.txns);
  return txn;
}

function deleteTxn(id) {
  state.txns = state.txns.filter(function (t) { return t.id !== id; });
  saveTxns(state.txns);
}

function clearAllTxns() {
  state.txns = [];
  saveTxns(state.txns);
}

function visibleTxns() {
  return state.txns
    .filter(function (t) {
      if (state.filter !== 'all' && t.type !== state.filter) return false;
      if (state.catFilter !== 'All' && t.category !== state.catFilter) return false;
      return true;
    })
    .sort(function (a, b) {
      if (a.date !== b.date) return b.date < a.date ? -1 : 1;
      return b.id - a.id;
    });
}

function renderSummary() {
  var t = computeTotals(state.txns);
  document.getElementById('totalBalance').textContent = fmt(t.balance);
  document.getElementById('totalIncome').textContent = fmt(t.income);
  document.getElementById('totalExpense').textContent = fmt(t.expense);
}

function renderList() {
  var list = document.getElementById('txnList');
  var rows = visibleTxns();
  if (!rows.length) {
    list.innerHTML = '<div class="empty">No transactions yet — add one above to get started.</div>';
    return;
  }
  list.innerHTML = rows.map(function (t) {
    var sign = t.type === 'income' ? '+' : '−';
    return '<div class="txn ' + t.type + '">' +
      '<div class="icon">' + (CAT_ICONS[t.category] || '📦') + '</div>' +
      '<div class="info"><div class="desc">' + esc(t.desc) + '</div>' +
      '<div class="meta"><span class="badge">' + esc(t.category) + '</span><span>' + fmtDate(t.date) + '</span></div></div>' +
      '<div class="amount">' + sign + ' ' + fmt(t.amount) + '</div>' +
      '<button class="del" type="button" data-del="' + t.id + '" title="Delete">×</button>' +
      '</div>';
  }).join('');
}

function renderBars() {
  var bars = document.getElementById('bars');
  var data = getExpenseByCategory(state.txns);
  if (!data.length) {
    bars.innerHTML = '<div class="bars-empty">No expenses yet — category breakdown will appear here.</div>';
    return;
  }
  var max = data[0].total;
  bars.innerHTML = data.map(function (d) {
    var pct = Math.round(d.total / max * 100);
    return '<div class="bar-row"><div class="cat-name">' + esc(d.category) + '</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="cat-amount">' + fmt(d.total) + '</div></div>';
  }).join('');
}

function renderAll() {
  renderSummary();
  renderList();
  renderBars();
}

document.getElementById('addForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var desc = document.getElementById('desc').value;
  var amount = parseFloat(document.getElementById('amount').value);
  if (!desc.trim() || !(amount > 0)) return;
  addTxn({
    desc: desc,
    amount: amount,
    type: document.getElementById('type').value,
    category: document.getElementById('category').value,
    date: document.getElementById('date').value || isoDate(0)
  });
  document.getElementById('addForm').reset();
  document.getElementById('date').value = isoDate(0);
  renderAll();
});

document.getElementById('txnList').addEventListener('click', function (e) {
  var btn = e.target.closest ? e.target.closest('[data-del]') : null;
  if (btn) {
    deleteTxn(parseInt(btn.getAttribute('data-del'), 10));
    renderAll();
  }
});

document.querySelectorAll('.chip').forEach(function (chip) {
  chip.addEventListener('click', function () {
    document.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('active'); });
    chip.classList.add('active');
    state.filter = chip.getAttribute('data-filter');
    renderList();
  });
});

document.getElementById('catFilter').addEventListener('change', function (e) {
  state.catFilter = e.target.value;
  renderList();
});

document.getElementById('clearAll').addEventListener('click', function () {
  if (state.txns.length && confirm('Delete ALL transactions? This cannot be undone.')) {
    clearAllTxns();
    renderAll();
  }
});

document.getElementById('date').value = isoDate(0);
renderAll();
</script>
</body>
</html>
